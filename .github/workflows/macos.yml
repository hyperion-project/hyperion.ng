name: macOS Builds

on:
  # Reusable from push_pull.yml
  workflow_call:
    inputs:
      event_name:
        type: string
        description: The event name
        default: ''
        required: false
      pull_request_number:
        type: string
        description: The corresponding PR number
        default: ''
        required: false
      nightly:
        type: boolean
        description: Nightly build
        default: false
        required: false
      publish:
        type: boolean
        description: Package publishing
        default: false
        required: false

jobs:

  macos:
    name: ${{ matrix.os.description }}
    runs-on: ${{ matrix.os.architecture == 'x64' && 'macos-15-intel' || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          { architecture: 'arm64', description: 'macOS 15 (arm64)' },
          { architecture: 'x64', description: 'macOS 15 (x64)' }
        ]

    steps:
      - name: ⬇ Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0  # Ensures all tags are fetched

      - name: 🔧 Prepare
        shell: bash
        run: |
          tr -d '\n' < .version > temp && mv temp .version
          if [[ "${{ inputs.event_name }}" == "pull_request" ]]; then
            echo -n "+PR${{ inputs.pull_request_number }}" >> .version
          elif [[ "${{ inputs.nightly }}" = true ]]; then
            echo -n "+nightly$(date '+%Y%m%d')" >> .version
          fi

      - name: 🔍 Read Qt version
        id: deps
        shell: pwsh
        run: |
          $qt = (Get-Content PreBuiltSpecs.json -Raw | ConvertFrom-Json).hashes.macos.'${{ matrix.os.architecture }}'.qt_version
          "qt_version=$qt" >> $env:GITHUB_OUTPUT

      - name: 📥 Install Qt ${{ steps.deps.outputs.qt_version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.deps.outputs.qt_version }}
          target: 'desktop'
          modules: 'qtserialport qtwebsockets'
          cache: 'true'
          cache-key-prefix: 'cache-qt-macos'

      - name: 👷 Build
        shell: bash
        run: |
          cmake --preset macos-${{ env.BUILD_TYPE }} -DUSE_PRE_BUILT_DEPS=ON
          cmake --build --preset macos-${{ env.BUILD_TYPE }} --target package
        env:
          BUILD_TYPE: ${{ inputs.event_name == 'pull_request' && 'debug' || 'release' }}

      - name: 📦 Upload
        if: ${{ inputs.publish || inputs.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.event_name == 'pull_request' && env.NAME || format('artifact-{0}', env.NAME) }}
          path: 'build/Hyperion-*'
        env:
          NAME: ${{ format('macOS_{0}', matrix.os.architecture) }}
