name: 📊 CodeQL
run-name: |
  ${{ github.event_name == 'schedule' && '⏰ Scheduled CodeQL run' || '' }}
  ${{ github.event_name == 'push' && format('📊 Pushed CodeQL run - {0}', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('📊 CodeQL run for PR {0} - {1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "36 18 * * 4"

jobs:
  analyze:
    name: 📊 Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
            container: ~
          - language: javascript
            build-mode: none
            container: ~
          - language: cpp
            build-mode: manual
            container:
              image: ghcr.io/hyperion-project/debian:bookworm-qt6
              options: -v /__t/CodeQL:/__t/CodeQL -v /opt/hostedtoolcache/CodeQL:/opt/hostedtoolcache/CodeQL

    container: ${{ matrix.container }}

    steps:
      - name: ⬇ Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: ⚙️ Mark Workspace Safe for Git
        if: ${{ matrix.language == 'cpp' }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 🔁 Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality
          config-file: ./.github/config/codeql.yml

      - name: 📥 Install jq & Pre-Build Deps (C++)
        if: ${{ matrix.language == 'cpp' }}
        shell: bash
        run: |
          apt-get update && apt-get install -y jq

      - name: 💾 Download Pre-Build Dependencies (C++)
        if: ${{ matrix.language == 'cpp' }}
        id: dependencies
        uses: ./.github/actions/download-pre-built-deps
        with:
          os: 'debian_bookworm'
          architecture: 'amd64'
          build_type: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}

      - name: ⚡ Setup ccache
        if: ${{ matrix.language == 'cpp' }}
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-codeql-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-codeql-ccache-master
            ${{ runner.os }}-codeql-ccache-

      - name: 👷 Build (C++)
        if: ${{ matrix.language == 'cpp' }}
        run: |
          # Ensure ccache uses the workspace directory shared with the host
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"
          
          cmake --preset linux-${{ env.BUILD_TYPE }} ${{ steps.dependencies.outputs.cmakeArgs }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build --preset linux-${{ env.BUILD_TYPE }}
        env:
          BUILD_TYPE: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: 🏃 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
          upload: False
          output: sarif-results

      - name: 🆔 Filter SARIF
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -dependencies/**
            -/**/dependencies/**
            -moc_*.cpp
            -/**/moc_*.cpp
            -build/**
            -/**/build/**
            -*.pb.cc
            -/**/*.pb.cc
            -*.pb.h
            -/**/*.pb.h
          input: sarif-results/${{ matrix.language }}.sarif
          output: sarif-results/${{ matrix.language }}.sarif

      - name: 📦 Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif

      - name: 📦 Upload loc as a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.language }}.sarif
          path: sarif-results
          retention-days: 1